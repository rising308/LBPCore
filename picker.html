<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Picker</title>
    <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
    <style>
        :root {
            --bg-color: #FFFFFF;

        }
        body {
            background: linear-gradient(to bottom, hotpink, crimson);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        #pickerContainer {
            margin-bottom: 0px;
            padding: 102px;
            background-color: argb(0,0,0, 0.0);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #values {
            font-size: 10rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--text-color);
            background: var(--bg-color);
            padding: 10px 40px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .iro-slider, .iro-slider-handle {
            border-radius: 0 !important;
        }

        .iro-slider rect, .iro-slider-handle rect, .iro-slider-handle circle {
            rx: 0 !important;
            ry: 0 !important;
            r: 0 !important;
        }

        .iro-slider-handle {
            clip-path: inset(0 0 0 0);
        }
    </style>
</head>
<body><a href="https://www.luigibrother.party/cdn-cgi/content?id=E3X_jTvTF2iR3kX6rFJYfJ2U8MyRA_d48SurgAz4i7U-1778219036.3799946-1.0.1.1-wcapDBoxWfeksESd1Nfm7Hh7_5NC8W0er8K6YFj47wo" aria-hidden="true" rel="nofollow noopener" style="display: none !important; visibility: hidden !important"></a>

    <div id="pickerContainer"></div>
    <div id="values">#FFFFFF</div>

    <script>
        const pickerSize = Math.min(window.innerWidth * 0.5, window.innerHeight * 0.5);

        var bg = document.querySelector(':root')
        
        function getStyle() {
        
        var bgs = getComputedStyle(bg);

        }

        var colorPicker = new iro.ColorPicker("#pickerContainer", {
            width: pickerSize,
            color: "#fff",
            borderWidth: 4,
            borderColor: "#000"
        });

        colorPicker.on('color:change', function(color) {
            const brightness = color.value;
            const textColor = (brightness > 50) ? '#000000' : '#ffffff';

            bg.style.setProperty('--text-color', textColor)  

            let cleanHex = color.hexString.toUpperCase();
            document.getElementById('values').innerHTML = cleanHex;
            bg.style.setProperty('--bg-color', cleanHex)
        });

        window.addEventListener('resize', function() {
            colorPicker.resize(Math.min(window.innerWidth * 0.5, window.innerHeight * 0.5));
        });
    </script>
